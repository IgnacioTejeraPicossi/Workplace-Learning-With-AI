<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
  <rect width="720" height="260" fill="#0b1020"/>
  <style>
    .box { fill:#0f1a30; stroke:#22d3ee; stroke-width:2; rx:8; ry:8; }
    .label { fill:#dff9ff; font-family:Segoe UI, Arial, sans-serif; font-size:13px; }
    .bar { fill:#22d3ee; }
    .bar2 { fill:#38bdf8; }
    .bar3 { fill:#818cf8; }
  </style>
  <rect class="box" x="20" y="20" width="320" height="220"/>
  <text class="label" x="180" y="40" text-anchor="middle">Latency (ms)</text>
  <rect class="bar" x="50" y="170" width="40" height="50"/>
  <rect class="bar2" x="110" y="130" width="40" height="90"/>
  <rect class="bar3" x="170" y="80" width="40" height="140"/>
  <text class="label" x="90" y="230">p50</text>
  <text class="label" x="150" y="230">p90</text>
  <text class="label" x="210" y="230">p95</text>

  <rect class="box" x="360" y="20" width="340" height="220"/>
  <text class="label" x="530" y="40" text-anchor="middle">Tokens & Cost</text>
  <text class="label" x="380" y="70">in</text>
  <rect class="bar2" x="410" y="60" width="80" height="15"/>
  <text class="label" x="380" y="100">out</text>
  <rect class="bar3" x="410" y="90" width="120" height="15"/>
  <text class="label" x="380" y="130">cost</text>
  <rect class="bar" x="410" y="120" width="60" height="15"/>
</svg>


