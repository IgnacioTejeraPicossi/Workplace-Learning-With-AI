<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="240" viewBox="0 0 940 240">
  <defs>
    <style>
      .box { fill:#ffffff; stroke:#334155; stroke-width:2; rx:8; ry:8; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#0f172a; font-weight:bold; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size:12px; fill:#334155; }
      .arrow { stroke:#334155; stroke-width:2; marker-end:url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
    </marker>
  </defs>

  <!-- Tokens -->
  <rect x="20" y="40" width="160" height="60" class="box"/>
  <text x="100" y="65" text-anchor="middle" class="title">Tokens</text>
  <text x="100" y="85" text-anchor="middle" class="label">["The","cat","sat"]</text>

  <!-- Embeddings -->
  <rect x="220" y="40" width="180" height="60" class="box"/>
  <text x="310" y="65" text-anchor="middle" class="title">Embeddings</text>
  <text x="310" y="85" text-anchor="middle" class="label">R^d vectors</text>

  <!-- Transformer Blocks -->
  <rect x="440" y="20" width="220" height="100" class="box"/>
  <text x="550" y="50" text-anchor="middle" class="title">Transformer Blocks</text>
  <text x="550" y="75" text-anchor="middle" class="label">Multi‑head Attention + MLP × N</text>

  <!-- Logits -->
  <rect x="700" y="40" width="200" height="60" class="box"/>
  <text x="800" y="65" text-anchor="middle" class="title">Logits / Probabilities</text>
  <text x="800" y="85" text-anchor="middle" class="label">next‑token distribution</text>

  <!-- Arrows -->
  <line x1="180" y1="70" x2="220" y2="70" class="arrow"/>
  <line x1="400" y1="70" x2="440" y2="70" class="arrow"/>
  <line x1="660" y1="70" x2="700" y2="70" class="arrow"/>

  <!-- Caption -->
  <text x="470" y="200" text-anchor="middle" class="label">Pipeline: Tokens → Embeddings → Transformer Blocks → Logits/Softmax</text>
</svg>

