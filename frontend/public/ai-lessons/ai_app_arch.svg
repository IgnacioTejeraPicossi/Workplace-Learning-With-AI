<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260">
  <rect width="720" height="260" fill="#0b1020"/>
  <style>
    .box { fill:#111a33; stroke:#4da3ff; stroke-width:2; rx:8; ry:8; }
    .label { fill:#e6f0ff; font-family:Segoe UI, Arial, sans-serif; font-size:14px; }
    .small { font-size:12px; fill:#aac8ff; }
    .arrow { stroke:#aac8ff; stroke-width:2; marker-end:url(#arrow); fill:none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#aac8ff"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="40" width="140" height="60"/>
  <text class="label" x="90" y="75" text-anchor="middle">Client</text>

  <rect class="box" x="190" y="40" width="160" height="60"/>
  <text class="label" x="270" y="65" text-anchor="middle">API Gateway</text>
  <text class="small" x="270" y="85" text-anchor="middle">auth · rate limit · logging</text>

  <rect class="box" x="380" y="20" width="150" height="60"/>
  <text class="label" x="455" y="45" text-anchor="middle">Model Provider</text>
  <text class="small" x="455" y="65" text-anchor="middle">OpenAI / LM Studio</text>

  <rect class="box" x="380" y="120" width="150" height="60"/>
  <text class="label" x="455" y="145" text-anchor="middle">Vector DB</text>
  <text class="small" x="455" y="165" text-anchor="middle">FAISS / Pinecone</text>

  <rect class="box" x="560" y="40" width="140" height="60"/>
  <text class="label" x="630" y="65" text-anchor="middle">Orchestration</text>
  <text class="small" x="630" y="85" text-anchor="middle">Agents / Flows</text>

  <line class="arrow" x1="160" y1="70" x2="190" y2="70"/>
  <line class="arrow" x1="350" y1="70" x2="380" y2="50"/>
  <line class="arrow" x1="350" y1="70" x2="380" y2="150"/>
  <line class="arrow" x1="530" y1="70" x2="560" y2="70"/>
  <line class="arrow" x1="630" y1="100" x2="455" y2="150"/>
</svg>


