<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260">
  <defs>
    <style>
      .box{fill:#f8fafc;stroke:#0ea5e9;stroke-width:2}
      .text{font:14px sans-serif;fill:#0f172a}
      .muted{font:12px sans-serif;fill:#475569}
      .arrow{marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <!-- Tokens -->
  <rect class="box" x="20" y="40" rx="6" ry="6" width="120" height="60"/>
  <text class="text" x="80" y="70" text-anchor="middle">Tokens</text>
  <text class="muted" x="80" y="90" text-anchor="middle">["The","cat","sat"]</text>
  <!-- Embeddings -->
  <rect class="box" x="180" y="40" rx="6" ry="6" width="150" height="60"/>
  <text class="text" x="255" y="70" text-anchor="middle">Embeddings</text>
  <text class="muted" x="255" y="90" text-anchor="middle">vectors</text>
  <!-- Attention -->
  <rect class="box" x="370" y="40" rx="6" ry="6" width="150" height="60"/>
  <text class="text" x="445" y="70" text-anchor="middle">Attention</text>
  <text class="muted" x="445" y="90" text-anchor="middle">weights</text>
  <!-- Decoder -->
  <rect class="box" x="560" y="40" rx="6" ry="6" width="180" height="60"/>
  <text class="text" x="650" y="70" text-anchor="middle">Next‑token</text>
  <text class="muted" x="650" y="90" text-anchor="middle">prediction</text>
  <!-- Arrows -->
  <line x1="140" y1="70" x2="180" y2="70" stroke="#334155" stroke-width="2" class="arrow"/>
  <line x1="330" y1="70" x2="370" y2="70" stroke="#334155" stroke-width="2" class="arrow"/>
  <line x1="520" y1="70" x2="560" y2="70" stroke="#334155" stroke-width="2" class="arrow"/>
  <!-- Context window -->
  <rect x="20" y="140" width="720" height="50" rx="6" ry="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="muted" x="380" y="170" text-anchor="middle">Context window: prompt + generated tokens</text>
</svg>

