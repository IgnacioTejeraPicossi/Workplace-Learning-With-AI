<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="740" height="260">
  <rect width="740" height="260" fill="#0b1020"/>
  <style>
    .box { fill:#121a35; stroke:#8b5cf6; stroke-width:2; rx:8; ry:8; }
    .label { fill:#efeaff; font-family:Segoe UI, Arial, sans-serif; font-size:13px; }
    .arrow { stroke:#c4b5fd; stroke-width:2; marker-end:url(#arrow); fill:none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c4b5fd"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="100" width="120" height="60"/>
  <text class="label" x="80" y="135" text-anchor="middle">Intent</text>

  <rect class="box" x="160" y="30" width="150" height="60"/>
  <text class="label" x="235" y="65" text-anchor="middle">Generate</text>

  <rect class="box" x="160" y="100" width="150" height="60"/>
  <text class="label" x="235" y="135" text-anchor="middle">Extract JSON</text>

  <rect class="box" x="160" y="170" width="150" height="60"/>
  <text class="label" x="235" y="205" text-anchor="middle">RAG Search</text>

  <rect class="box" x="340" y="100" width="160" height="60"/>
  <text class="label" x="420" y="135" text-anchor="middle">Policy (latency/cost)</text>

  <rect class="box" x="530" y="100" width="180" height="60"/>
  <text class="label" x="620" y="135" text-anchor="middle">Provider (OpenAI / LM Studio)</text>

  <line class="arrow" x1="140" y1="130" x2="160" y2="60"/>
  <line class="arrow" x1="140" y1="130" x2="160" y2="130"/>
  <line class="arrow" x1="140" y1="130" x2="160" y2="200"/>
  <line class="arrow" x1="310" y1="60" x2="340" y2="130"/>
  <line class="arrow" x1="310" y1="130" x2="340" y2="130"/>
  <line class="arrow" x1="310" y1="200" x2="340" y2="130"/>
  <line class="arrow" x1="500" y1="130" x2="530" y2="130"/>
</svg>


