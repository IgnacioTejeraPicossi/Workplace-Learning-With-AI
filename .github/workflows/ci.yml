name: CI

# Minimal continuous-integration gate for WLWAI.
# - backend: compile-all syntax check + dependency resolution + offline tests
# - frontend: install + production build
# Kept intentionally lightweight so it stays green and fast; it does NOT
# require MongoDB, Firebase or any secret. The test step runs only the
# mock-first suites that are verified to pass with no database, no LLM key
# and no Firebase credentials. Extend with the Mongo-backed suites (e.g.
# smoke_red_cross_qa baselines, robomind contracts) once a MongoDB service
# container + CI fixtures are added.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (syntax + deps + offline tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Compile all backend sources (syntax gate)
        run: python -m compileall -q backend

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Offline, mock-first suites only (56 tests): voice examples, the 6
      # language agents' contracts, and the MCP manifest smoke. These are
      # verified to pass without MongoDB, an LLM key or Firebase creds.
      # MONGO_URI points at an unreachable host with a short server-selection
      # timeout so any accidental DB access fails fast instead of hanging.
      - name: Run offline test suites (no DB / no secrets)
        env:
          MONGO_URI: "mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=2000"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pytest -q \
            backend/tests/test_voice_examples.py \
            backend/tests/test_language_agents_contracts.py \
            backend/tests/test_mcp_smoke.py

  frontend:
    name: Frontend (install + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No package-lock.json is committed, so use `npm install` (not `npm ci`).
      # --legacy-peer-deps: the tree has a known peer-dependency conflict
      # (postprocessing@6.39.2 wants three >=0.168 <0.186, but the project pins
      # three@^0.155). npm >= 7 treats this ERESOLVE as a hard error; the flag
      # restores the older, permissive resolution (the app builds and runs fine
      # with three@0.155). Locally npm 11 tolerates it; CI's npm errors without it.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Production build
        env:
          # Create React App promotes ESLint warnings to errors when CI=true.
          # The project currently has many pre-existing warnings, so we keep
          # the build green here while still surfacing them in the logs.
          # Tighten this to 'true' once the warnings are cleaned up.
          CI: 'false'
        run: npm run build
